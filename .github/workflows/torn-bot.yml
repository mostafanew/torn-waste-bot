name: Torn Waste Bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  waste-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd cdp_bot && npm install
      - env:
          TORN_API_KEY: ${{ secrets.TORN_API_KEY }}
        run: cd cdp_bot && node bot.js
